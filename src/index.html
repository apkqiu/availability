<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<body>
		<noscript>
			<div style="background-color: #ffff00; border: 1px solid #ffaa00; border-radius: 5px; padding: 0 10px">

			</div>
		</noscript>
		<div style="background-color: #ffff00; border: 1px solid #ffaa00; border-radius: 5px; padding: 0 10px;display: none;" id="fileuri_warn">
			<p><b style="color: #ffaa00">重要警告</b></p>

		</div>
        <script>
            if (window.location.href.indexOf('file://') == 0) {
                document.getElementById('fileuri_warn').style.display = 'block';
            }else{
window.location.href = './home.html';
            }
        </script>
		<p><a href="./home.html">如果没有跳转，请点击此处</a></p>
