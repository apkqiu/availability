{%extends "parts/main.html"%} {%block title%} 洽隐山房 | 新闻 {%endblock%} {%block title_in%} 洽隐山房 | 新闻 {%endblock%} {%block body%}
<h1>新闻</h1>
<style>
	a {
		text-decoration: none;
	}
	.preview {
		width: 100%;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
		height: 3em;
	}
</style>
<div class="row">
	<div class="col-md-8">
		<h2>最新文章</h2>
		<ul class="list-group list-group-flush w-100" id="articles"></ul>
	</div>
	<div class="col-md" style="position:sticky">
		<h2>周报出版</h2>
		<ul class="list-group list-group-flush">
			{% for id in list_newspaper()%}
			<li class="list-group-item">
				<a href="../pdf_embed.html#p={{id}}">周恩来周报 第{{id}}期</a>
			</li>
			{% endfor %}
		</ul>
	</div>
</div>

<script>
	$('#articles').html('<div class="spinner-border"></div>');
	$.get('articles.json').then(function (data) {
		$('#articles').html('');
		// get keys of data
		var keys = Object.keys(data);
		// reverse keys
		keys.reverse();
		// loop through keys

		for (var i = 0; i < keys.length; i++) {
			const key = keys[i];
			const url = data[key];
			hrefurl = '../embed.html?' + url;
			previewurl = 'content/' + url;

			$('#articles').append(
				"<li class='list-group-item'><span class='h3'><a href='" +
					hrefurl +
					"'>" +
					key +
					'</a></span><br><div id="preview' +
					url +
					'" class="preview">没有可用的预览。</div></li>'
			);
			$.get(previewurl).then(function (data) {
				var target = document.getElementById('preview' + url);
				if (target) {
					target.innerHTML = data;
					target.innerText = target.innerText
						.replace(key, '')
						.replace(/\n{2,}/g, '\n')
						.trimStart('\n')
						.substring(0, 1000);
					clearInterval(interval);
				}
			});
		}
	});
</script>
{%endblock%}
