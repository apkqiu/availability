<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="../../res/css/All.css" />
		<title>洽隐山房主页|小工具</title>
	</head>
	<body>
		<h2>转换</h2>
		<textarea id="changeDocumentBefore" placeholder="正常文本" value=""></textarea>
		<textarea id="changeDocumentAfter" placeholder="压缩乱码"></textarea>
		<a href="#" id="changeDocumentBtn" onclick="changeDocument()">开始转换</a>
		<a href="#" id="changeDocumentBtn" onclick="changeDocumentBack()">开始反转换</a>
		<script>
			// 定义替换规则数组
			var tagChange = [
				/*
                注：^(shift+6)为转义符
                   元素节点属性例如    ?id:dome
            */
				[/\[/gi, '^[', /\^\[/gi, '['],
				[/\]/gi, '^]', /\^\]/gi, ']'], //[]→^[^]
				[/<!DOCTYPE html>/, '!QiaYinShanFang', /!QiaYinShanFang/g, '<!DOCTYPE html>'], //水印
				[/<html>/, '`{{', /\`{{/g, '<html>'],
				[/<\/html>/, '`}}', /\`}}/g, '</html>'],
				[/<head>/, '`h{', /`h{/g, '<head>'],
				[/<\/head>/, '`h}', /`h}/g, '</head>'],
				[/<body>/, '`b{', /`b{/g, '<body>'],
				[/<\/body>/, '`b}', /`b}/g, '</body>'],
				[/(?<!<)\//g, '`\\', /`\\/g, '/'], //普通斜杠变成`加反斜杠
				[/(?<=<\w+?\s)(.+?)="(.+?)"(?=(\s|>))/gi, '?$1:$2', /(?<=<.+?)\?([^>\?]+):([^>\?]+)/gi, ' $1="$2"'], //属性  id="dome"  → ?id:dome
				[/<!--([^䵣]+?)-->/gi, '/`$1`/', /\/`([^(?:`\/)]+?)`\//gi, '<!--$1-->'], //注释文本
				[/<([a-zA-Z]+?)(.+?)>/gi, '[$1$2/', /\[(.+?)\//gi, '<$1>'], // <tag ... > → [tag ... /
				[/<\/([a-zA-Z]+?)>/gi, '\\$1]', /\\(.+?)\]/gi, '</$1>'], // </tag> → \tag]
				[/\n\s+/g, '`n+', /`n\+/gi, '\n  '], //换行符加空格
				[/\n/g, '`n', /`n/gi, '\n'], // 换行符 \n → `n
				/*常用字符
                `A  :  &nbsp;
                `C  :  class
                `d  :  div
                `D  :  document
                `F  :  font-
                `L  :  link
                `n  :  换行符
                `S  :  script
                `T  :  title
            */
				[/&nbsp;/gi, '`A', /`A/g, '&nbsp;'],
				[/class/gi, '`C', /`C/g, 'class'],
				[/div/gi, '`d', /`d/g, 'div'],
				[/document/gi, '`D', /`D/g, 'document'],
				[/font-/gi, '`F', /`F/g, 'font-'],
				[/link/gi, '`L', /`L/g, 'link'],
				[/script/gi, '`S', /`S/g, 'script'],
				[/title/gi, '`T', /`T/g, 'title']
			];

			function changeDocument() {
				// 获取输入文本
				var before = document.getElementById('changeDocumentBefore').value;
				var after = before; // 初始化替换结果

				// 循环应用所有替换规则
				for (var i = 0; i < tagChange.length; i++) {
					after = after.replace(tagChange[i][0], tagChange[i][1]);
					console.log('由', tagChange[i][0], '变', tagChange[i][1], '得', after);
				}

				// 将结果写回输出框
				document.getElementById('changeDocumentAfter').value = after;
				console.log('转换成功');

				// 可选：返回替换后的文本
				return after;
			}

			function changeDocumentBack() {
				// 获取输入文本
				var before = document.getElementById('changeDocumentAfter').value;
				var after = before; // 初始化替换结果

				// 循环应用所有替换规则
				for (var i = tagChange.length - 1; i > -1; i--) {
					after = after.replace(tagChange[i][2], tagChange[i][3]);
					console.log('由', tagChange[i][2], '变', tagChange[i][3], '得', after);
				}

				// 将结果写回输出框
				document.getElementById('changeDocumentBefore').value = after;
				console.log('转换成功');

				// 可选：返回替换后的文本
				return after;
			}
		</script>

		<script src="../../res/js/All.js"></script>
		<script>
			document.getElementById('nowPlace').innerHTML = `
            <a class="anone" href="../../zhuye.html">洽隐山房主页</a>>小工具
        `;
		</script>
	</body>
</html>
