<!doctype html>
<html lang="en" style="min-height: 100vh;">

<head>
    <div id="script-mount-node"></div>

    <script>
        const root = "{{root}}";
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{%block title%}{%endblock%}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"
        defer></script>
    <script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.2/dist/umd/index.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/parallax/3.1.0/parallax.min.js"></script>
    <script src="{{root}}/res/js/obj_index.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            function hex2rgb(hex) {
                let r = 0, g = 0, b = 0;
                // 3 digits
                if (hex.length == 4) {
                    r = parseInt(hex[1] + hex[1], 16);
                    g = parseInt(hex[2] + hex[2], 16);
                    b = parseInt(hex[3] + hex[3], 16);
                }
                // 6 digits
                else if (hex.length == 7) {
                    r = parseInt(hex[1] + hex[2], 16);
                    g = parseInt(hex[3] + hex[4], 16);
                    b = parseInt(hex[5] + hex[6], 16);
                }
                return [r, g, b];
            }
            var color = localStorage.getItem('color') || '#ffffff';
            if (localStorage.getItem("adv_bg") == "false")
                document.getElementById("mainbody").style.background = "rgba(" + hex2rgb(color).join(",") + ",1)";
            else
                document.getElementById("mainbody").style.background = "rgba(" + hex2rgb(color).join(",") + ",0.5)";
        })
    </script>
    <script>
        if (localStorage.getItem('no-anim') == 'true') {
            var style_noanim = document.createElement('style')
            style_noanim.innerHTML = `*{transition: none !important;animation: none !important;}`
            document.getElementById("script-mount-node").appendChild(style_noanim)
        }
    </script>
</head>

<header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" style="position:fixed;width:100%;z-index: 1001;">
        <div class="container-fluid">
            <span>{%block title_in%}{%endblock%}</span>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{root}}/home.html">首页</a>
                </li>
                <li class="nav-item">
                    <button type="button" class="nav-link" data-bs-toggle="modal" data-bs-target="#exampleModal">
                        公告
                    </button>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">报错</a>
                </li>
            </ul>
            <div class="d-flex">
                <a class="btn" data-bs-toggle="offcanvas" href="#offcanvasExample" role="button"
                    aria-controls="offcanvasExample">
                    <span class="navbar-toggler-icon"></span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Offcanvas -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasExampleLabel">菜单</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="mb-3">
                <a href="{{root}}/home.html" class="btn btn-secondary">返回首页</a>
                <a href="{{root}}/account/index.html" class="btn btn-secondary">账号管理</a>
            </div>
            <script>
                function set_empty() {
                    var result = document.getElementById("searchResult");
                    var a = document.createElement("a");
                    a.href = "#";
                    a.innerText = "开始搜索吧";
                    a.classList.add("list-group-item");
                    result.appendChild(a);
                }
                document.addEventListener("DOMContentLoaded", function () {
                    set_empty();
                });
                function search() {
                    var input = document.getElementById("searchInput").value;
                    var result = document.getElementById("searchResult");
                    result.innerHTML = "";
                    if (input == "") {
                        set_empty();
                        return;
                    }
                    var res = search_document(input);
                    res.forEach(res => {
                        var a = document.createElement("a");
                        a.href = root + res.url;
                        var span = document.createElement("span");
                        span.innerText = res.title;
                        a.appendChild(span);
                        var small = document.createElement("span");
                        small.style.float = "right";
                        small.style.color = "#aaa";
                        small.innerText = res.tag;
                        a.appendChild(small);
                        a.classList.add("list-group-item");
                        result.appendChild(a);
                    });
                    if (res.length == 0) {
                        var a = document.createElement("a");
                        a.href = "#";
                        a.innerText = "没有找到关于“" + input + "”的结果";
                        a.classList.add("list-group-item");
                        result.appendChild(a);
                    }
                }
            </script>

            <ul class="list-group">
                <li class="input-group clearfix">
                    <input type="text" class="form-control" placeholder="搜索" aria-label="搜索" id="searchInput"
                        aria-describedby="button-addon2" oninput="search()">
                    <button class="btn btn-outline-secondary" type="button" id="button-addon2"
                        onclick="search()">搜索</button>
                </li>
                <div id="searchResult"></div>
            </ul>
        </div>
    </div>
    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">公告</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    更新：<br>
                    v2.0.0<br>
                    1. 整体模板化+使用Bootstrap<br>
                    2. 整体美化<br>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>
</header>

<body style="min-height: 100vh;">

    <div style="position: fixed; left: -10vw;top: -10vh;right: -10vw;bottom: -10vh;overflow: hidden;z-index: -10;">
        <ul id="scene">
            <li class="layer" data-depth="0.40">
                <img src="{{root}}/res/img/SchoolGate.jpg" style="height: 120vh;width: 120vw;object-fit:cover;">
            </li>

        </ul>

    {%block outbody%}

        id="mainbody">
        {%block body%}{%endblock%}
    </div>
    <script>
        document.getElementById("mainbody").style.paddingTop = getComputedStyle(document.getElementsByTagName("nav")[0]).height;

        window.onresize = function () {
            document.getElementById("mainbody").style.paddingTop = getComputedStyle(document.getElementsByTagName("nav")[0]).height;
        }
    </script>
    <script>
        var scene = document.getElementById('scene');
        var parallax = new Parallax(scene);
    </script>
</body>
