{%extends "parts/main.html"%}

{%block title%}
柳荫眠琴 | 账号管理
{%endblock%}

{%block title_in%}
柳荫眠琴 | 账号管理
{%endblock%}

{%block outbody%}
<div class="modal fade" data-bs-backdrop="static" id="Info" tabindex="-1" aria-labelledby="ErrorLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-body">
                提交成功<br>
                注册信息会保存到浏览器用户数据中
            </div>
            <div class="modal-footer">
                <a type="button" class="btn btn-primary" href="index.html">返回</a>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" data-bs-backdrop="static" id="Error" tabindex="-1" aria-labelledby="ErrorLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-body">
                两次输入的密码不一致
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">确定</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" data-bs-backdrop="static" id="Error2" tabindex="-1" aria-labelledby="ErrorLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-body">
                密码只能包括数字，字母，下划线
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">确定</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" data-bs-backdrop="static" id="Error3" tabindex="-1" aria-labelledby="ErrorLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-body">
                输入值不能为空
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">确定</button>
            </div>
        </div>
    </div>
</div>

{%endblock%}

{%block body%}
<h1>注册</h1>
<script>
    function register() {
        var username = document.getElementById("username").value;
        var password = document.getElementById("password").value;
        var password2 = document.getElementById("password2").value;
        if (password != password2) {
            $("#Error").modal('show');
            return;
        }
        if (/\W/g.test(password)) {
            $("#Error2").modal('show');
            return;
        }
        if (username == "" || password == "" || password2 == "") {
            $("#Error3").modal('show');
            return;
        }
        localStorage.setItem("username", JSON.stringify(username));
        localStorage.setItem("password", JSON.stringify(password));
        localStorage.setItem("accountBe", "true");
        $("#Info").modal('show');
    }
</script>
<div>
    <!--标签对齐，文本框对齐，宽度4/12-->
    <div class="form-group row m-3">
        <label for="username" class="col-sm-4 col-form-label">用户名</label>
        <div class="col-sm-8">
            <input type="text" class="form-control" id="username" name="username" placeholder="用户名">
        </div>
    </div>
    <div class="form-group row m-3">
        <label for="password" class="col-sm-4 col-form-label">密码</label>
        <div class="col-sm-8">
            <input type="password" class="form-control" id="password" name="password" placeholder="密码">
        </div>
    </div>
    <div class="form-group row m-3">
        <label for="password2" class="col-sm-4 col-form-label">确认密码</label>
        <div class="col-sm-8">
            <input type="password" class="form-control" id="password2" name="password2" placeholder="确认密码">
        </div>
    </div>
    <div class="form-group row m-3">
        <div class="col-sm-8 offset-sm-4">
            <button onclick="register()" class="btn btn-primary">注册</button>
        </div>
    </div>
</div>

{%endblock%}
