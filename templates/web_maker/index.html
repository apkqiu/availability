{%extends "parts/main.html"%}

{%block title%}
棕亭霁雪 | 自制网页
{%endblock%}

{%block title_in%}
棕亭霁雪 | 自制网页
{%endblock%}

{%block body%}

<button class="btn btn-primary m-1" onclick="window.open('sandbox.html', '_blank')">预览</button>
<button class="btn btn-primary m-1" onclick="download()">保存</button>
<button class="btn btn-primary m-1" onclick="upload()">打开</button>

<!--左半边代码编写，右半边iframe沙盒(bootstrap)式布局-->
<div class="row">
    <div class="col-md-6">
        <textarea id="area" style="width:100%;height:90vh;font-family: monospace;" class="form-control"
            placeholder="请输入代码"></textarea>
    </div>
    <div class="col-md-6">
        <iframe src="sandbox.html" id="frame" style="width:100%;height:90vh"></iframe>
    </div>
</div>
<script>
    var codearea = document.getElementById("area");
    var frame = document.getElementById("frame");
    codearea.addEventListener("input", update);
    codearea.value = window.localStorage.getItem("code");
    frame.src = "sandbox.html?"+Math.random();
    function update(){
        window.localStorage.setItem("code", codearea.value);
        frame.src = "sandbox.html?"+Math.random();
    }
    function download() {
        // Create an file with the content of the textarea
        var file = new File([codearea.value], "code.html", { type: "text/html" });
        // Create a temporary link element
        var link = document.createElement("a");
        // Set the href attribute to the file object
        link.href = URL.createObjectURL(file);
        // Set the download attribute to the desired filename
        link.download = "code.html";
        // Append the link to the document body
        document.body.appendChild(link);
        // Click the link to trigger the download
        link.click();
        // Remove the link from the document body
        document.body.removeChild(link);
    }
    function upload() {
        var input = document.createElement("input");
        input.type = "file";
        input.accept = ".html";
        input.onchange = function (event) {
            var file = event.target.files[0];
            var reader = new FileReader();
            reader.onload = function (event) {
                codearea.value = event.target.result;
                frame.src = "sandbox.html?"+Math.random();
                update();
            };
            reader.readAsText(file);
        };
        input.click();
    }
</script>

{%endblock%}
