    /* 搜索虚词 */for (var i = 0; i < xuci.length; i++) {if (xuci[i].includes(value)) results.push(xuci[i]);}
    va.innerHTML = results.length > 0 ? results.join('<br><hr>') : "未找到相关词条";
}
    </script>
</body>
