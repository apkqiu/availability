<script>
    function load() {
        var url = getarg("url") || "/home.html";
        $("#offcanvasExample").offcanvas('hide');
        $(".hidden").removeClass("hidden");
        $('#nav').css('backdropFilter', 'blur(10px)');
        document.title = "加载中...";
        $("#app").html("");
        $("#title_in").hide(100);
        $("#app_out").hide(100);
        $("#errors").html("");
        $.get("../templates" + url,).then(function (data) {
            data = data.replaceAll("\{\{root\}\}", "#url=");
            data = data.replaceAll("\{\{true_root\}\}", ".");

            console.log(data);

            var title_start = data.indexOf("\{\%block title\%\}");
            var title_end = data.indexOf("\{\%endblock\%\}", title_start + 1);
            var title = data.substring(title_start + 15, title_end);
            if (title_start != -1) document.title = title;
            else document.title = "洽隐山房";

            var title_in_start = data.indexOf("\{\%block title_in\%\}");
            var title_in_end = data.indexOf("\{\%endblock\%\}", title_in_start + 1);
            var title_in = data.substring(title_in_start + 18, title_in_end);
            if (title_in_start != -1) $("#title_in").html(title_in);
            else $("#title_in").html("");

            var outbody_start = data.indexOf("\{\%block outbody\%\}");
            var outbody_end = data.indexOf("\{\%endblock\%\}", outbody_start + 1);
            var outbody = data.substring(outbody_start + 17, outbody_end);
            if (outbody_start != -1) $("#app_out").html(outbody);

            var body_start = data.indexOf("\{\%block body\%\}");
            var body_end = data.indexOf("\{\%endblock\%\}", body_start + 1);
            var body = data.substring(body_start + 14, body_end);
            if (body_start != -1) $("#app").hide().html(body).show(100);
            else $("#app").html("<div class='alert alert-danger'>加载失败: 模板不正确，没有找到 body 块</div>");

            $(".release-only").addClass("hidden");
            $(".beta-only").removeClass("hidden");

            $("#title_in").show(100);
            $("#app_out").show(100);
        }).fail(function (xhr, status, error) {
            $("#app").html("<div class='alert alert-danger'>加载失败: " + error + "</div>");
        })
        window.onhashchange = load;
    }
    window.onerror = function (msg, url, line, col, error) {
        $("#errors").append("<div class='alert alert-danger'>" + msg + " at " + url + ":" + line + ":" + col + "</div>");

    }
    $(document).ready(load)
    function should_load(url) {
        return getarg("url") != url;
    }
</script>

<footer>
	<script defer>
		if (new Date().getFullYear() > 2025) {
			$("#yr").text("2025-" + new Date().getFullYear());
		}
		// personalization
		var color = localStorage.getItem('color') || '#000000';
		if (localStorage.getItem('adv_bg') == 'false') {
			$('#bg').css('display', 'none');
			$('#mainbody').css('background', 'rgba(' + hex2rgb(color).join(',') + ',1)');
		}
		else {
			var brightness = localStorage.getItem('bgbrightness') || 50;
			if (brightness >= 100) $('#mask').css('background', 'rgba(255,255,255,' + ((brightness - 100) / 100) + ')');
			else $('#mask').css('background', 'rgba(0,0,0,' + ((100 - brightness) / 100) + ')');
			var coloropacity = localStorage.getItem('coloropacity') || 0;
			$("#mainbody").css('background', 'rgba(' + hex2rgb(color).join(',') + ',' + (coloropacity / 100) + ')');
			$("#bg").css("filter", "blur(" + (new Number(localStorage.getItem('bgblur')) || 0) + "px)");
		}
		if (localStorage.getItem('no-anim') == 'true') {
			var style_noanim = $('<style>*{transition: none !important;animation: none !important;}</style>');
			$('#script-mount-node').append(style_noanim);
		}
		if ((localStorage.getItem('dark') || 'true') == 'true') {
			$('#html-root').attr('data-bs-theme', 'dark');
		}
		var img = localStorage.getItem('imgbg') || 'bg-1.jpg';
		if (img == 'custom') {
			localforage.getItem('imgbg').then(function (value) {
				$('#bg').attr('src', value);
			});
		} else {
			$('#bg').attr('src', true_root + '/res/img/' + img);
		}
		// search
		$('#searchResult').html("<a href='#' class='list-group-item'>开始搜索吧</a>");
		// navbar fix
		$('#mainbody').css('padding-top', getComputedStyle(document.getElementsByTagName('nav')[0]).height);
		$(window).resize(function () {
			$('#mainbody').css('padding-top', getComputedStyle(document.getElementsByTagName('nav')[0]).height);
		});
		// parallax
		var scene = document.getElementById('scene');
		var parallax = new Parallax(scene);
		// VConsole 默认会挂载到 `window.VConsole` 上
		if (localStorage.getItem('vconsole') == 'true')
			var vConsole = new window.VConsole();
		function search() {
			$('#searchResult').empty();
			if ($('#searchInput').val() == '') {
				$('#searchResult').html("<a href='#' class='list-group-item'>开始搜索吧</a>");
				return;
			}
			var res = search_document($('#searchInput').val());
			res.forEach((res) => {
				$('#searchResult').append(
					$('<a class="list-group-item"></a>')
						.attr('href', root + res.url)
						.click(() => {
							$("#offcanvasExample").offcanvas('hide');
							$('#searchInput').val('');
						})
						.append(
							$('<span></span>')
								.css("float", "left")
								.text(res.title)
						)
						.append(
							$('<span></span>')
								.css("float", "right")
								.css("opacity", "0.5")
								.text(res.tag)
						).append(
							$("<div></div>")
								.css("clear", "both")
						)
				);
			});
			if (res.length == 0) {
				$('#searchResult').append(
					$('<a class="list-group-item"></a>')
						.attr('href', '#')
						.text('没有找到关于“' + $('#searchInput').val() + '”的结果')
				);
			}
		}
	</script>
</footer>
