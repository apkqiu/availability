            <script>
                function search(){
                    var input = document.getElementById("searchInput").value;
                    var result = document.getElementById("searchResult");
                    var suggest = document.getElementById("searchSuggestion");
                    result.innerHTML = "";
                    suggest.innerHTML = "";
                    miniSearch.search(input).forEach(res => {
                        var a = document.createElement("a");
                        a.href = root+res.url;
                        a.innerText = res.title;
                        a.classList.add("list-group-item");
                        result.appendChild(a);
                    });
                    miniSearch.autoSuggest(input).forEach(res => {
                        if(res.suggestion == input) return;
                        var a = document.createElement("a");
                        a.onclick = function(){document.getElementById("searchInput").value=res.suggestion;search()};
                        a.href="javascript:void(0);";
                        a.innerText = res.suggestion+"？";
                        suggest.appendChild(a);
                    });
                }
            </script>
            <div class="input-group mb-3">
                <input type="text" class="form-control" placeholder="搜索" aria-label="搜索" id="searchInput" aria-describedby="button-addon2" oninput="search()">

    <script>
        function getarg(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return unescape(r[2]); return null;
        }
        var p = getarg("p");
        p = {
            1: "v,../res/video/25.9.1xvexiaogongfang.mp4"
        }[p]
        if (p.startsWith("v,")) {
            p = p.substring(2);
            var video = document.createElement("video");
            video.src = p;
            video.controls = true;
            video.style.width = "100%";
            video.style.height = "90vh";
            video.autoplay = true;
            document.getElementById("iframe").appendChild(video);
            var interval = setInterval(() => {
                if (video.readyState == 4) {
                    clearInterval(interval);
                    video.pause();
                    video.dispatchEvent(new Event("click"));
                    video.play();
                }
            }, 10);
        }
        document.getElementById("p" + getarg("p")).classList.add("active");
    </script>
