<h1>震惊！事情真相太残酷！饭菜惊现不明生物</h1><p>李军昊</p><hr><p>5月21日午餐时间，初一（1）班某同学在红豆小圆子汤中发现一只虫（见下方），引发在场学生关注。该事件迅速在校园内传播，部分学生表示担忧。</p><p><img src=res/img/ccnews/009.1.01.jpg alt=""></p><p>生物韩老师表示：该生物有四对足（但有一只足不见了），有传闻说道是被郑子宸同学吃了，他表示：味苦，稍其酸。目前，这只虫子业已<sup class=footnote-ref><a href=#footnote1>[1]</a><a class=footnote-anchor id=footnote-ref1></a></sup>移交吴老师，将改天反映。目前杳如黄鹤。</p><p>5月29日，某同学在新品绿豆汤中又吃到小虫（见下方）。自此，学校汤的口碑不再好，喝汤人渐渐少。</p><p><img src=res/img/ccnews/009.1.02.jpg alt=""></p><hr class=footnotes-sep><section class=footnotes><ol class=footnotes-list><li id=footnote1 class=footnote-item><p>已经 <a href=#footnote-ref1 class=footnote-backref>↩︎</a></p></li></ol></section>
