<h1>震惊！我教室飞鸟</h1><hr><p>九月四日周四体育课，我教室飞进来一直麻雀，在摄像头上搭窝。</p><p>英勇的同学们使用各种办法，终于将鸟儿赶出教室。据悉，该鸟儿是由于我学生距离教室太远，随机刷新而成的。也有学生对此表示担忧，害怕尿湿落下来。也有同学记录下来这一历史性时刻。见《班鸟图》。</p><p><img src=res/img/ccnews/011.2.01.jpeg alt=""></p><p class=opacity-75>《班鸟图》</p><p>该<sup class=footnote-ref><a href=#footnote1>[1]</a><a class=footnote-anchor id=footnote-ref1></a></sup>鸟为压抑的学习氛围提供了减压，让平凡的生活拥有不一样的色彩。</p><hr class=footnotes-sep><section class=footnotes><ol class=footnotes-list><li id=footnote1 class=footnote-item><p>原文为“改”，因错字修改为“该”。 <a href=#footnote-ref1 class=footnote-backref>↩︎</a></p></li></ol></section>
