<h1>会阴戏语图</h1><p><sup class=footnote-ref><a href=#footnote1>[1]</a><a class=footnote-anchor id=footnote-ref1></a></sup></p><hr><p>这幅图描绘了九月二日的细雨。生动形象。附一首诗。诗曰：</p><p>金乔雨琪钱，惠荫细雨间。</p><p>避雷忽引雷，欲辨已忘言。</p><p>作业行政楼，归来雨纤纤。</p><p>忽闻体师事，原是英语前。</p><p><img src=res/img/ccnews/011.3.01.jpeg alt=""></p><hr class=footnotes-sep><section class=footnotes><ol class=footnotes-list><li id=footnote1 class=footnote-item><p>正确写法为“惠荫戏语图” <a href=#footnote-ref1 class=footnote-backref>↩︎</a></p></li></ol></section>
