    <!-- Offcanvas -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasExampleLabel">菜单</h5>

            </div>
            <script>
                function set_empty() {
                    var result = document.getElementById("searchResult");
                    var a = document.createElement("a");
                    a.href = "#";
                    a.innerText = "开始搜索吧";
                    a.classList.add("list-group-item");
                    result.appendChild(a);
                }
                document.addEventListener("DOMContentLoaded", function () {
                    set_empty();
                });
                function search() {
                    var input = document.getElementById("searchInput").value;
                    var result = document.getElementById("searchResult");
                    result.innerHTML = "";
                    if (input == "") {
                        set_empty();
                        return;
                    }
                    var res = miniSearch.search(input)
                    res.forEach(res => {
                        var a = document.createElement("a");
                        a.href = root + res.url;
                        a.innerText = res.title;
                        a.classList.add("list-group-item");
                        result.appendChild(a);
                    });
                    if (res.length == 0) {
                        var a = document.createElement("a");
                        a.href = "#";
                        a.innerText = "没有找到关于“" + input + "”的结果";
                        a.classList.add("list-group-item");
                        result.appendChild(a);
                    }
                }
            </script>

            <ul class="list-group">
                <li class="input-group clearfix">
                    <input type="text" class="form-control" placeholder="搜索" aria-label="搜索" id="searchInput"
                        aria-describedby="button-addon2" oninput="search()">
                    <button class="btn btn-outline-secondary" type="button" id="button-addon2"
                        onclick="search()">搜索</button>
                </li>
                <div id="searchResult"></div>
            </ul>
        </div>
    </div>
    <!-- Modal -->
