<h1>自制网页</h1>
<div class="list-group" id="files"></div>
<script>
	// 从localstorage获取文件数据
	var files = JSON.parse(localStorage.getItem('web_editor_files') || '[]');
	$('<a></a>')
		.addClass('list-group-item btn btn-success')
		.css('border-radius', '5px 5px 0px 0px ')
		.attr('href', '../web_maker/edit.html?id=null')
		.text('添加新文件')
		.appendTo($('#files'));

	// 遍历文件数据，生成列表项
	files.forEach(function (file) {
		$('<div></div>')
			.addClass('list-group-item')
			.append($('<span></span>').text(file.name))
			.append($('<br>'))
			.append(
				$('<button></button>')
					.addClass('btn btn-danger btn-sm m-1')
					.text('删除')
					.click(function () {
						var files = JSON.parse(localStorage.getItem('web_editor_files') || '[]');
						files = files.filter(function (f) {
							return f.id !== file.id;
						});
						localStorage.setItem('web_editor_files', JSON.stringify(files));
						localforage.removeItem(file.id);
						location.reload();
					})
			)
			.append(
				$('<a></a>')
					.addClass('btn btn-primary btn-sm m-1')
					.attr('href', '../web_maker/edit.html?id=' + file.id)
					.text('编辑')
			)
			.append(
				$('<button></button>')
					.addClass('btn btn-warning btn-sm m-1')
					.text('重命名')
					.click(function () {
						var files = JSON.parse(localStorage.getItem('web_editor_files') || '[]');
						// 找到当前的ID的索引
						var index = files.findIndex(function (f) {
							return f.id === file.id;
						});
						// 弹出重命名窗口
						var new_name = prompt('请输入新的文件名', files[index].name);
						if (new_name) {
							files[index].name = new_name;
							localStorage.setItem('web_editor_files', JSON.stringify(files));
							location.reload();
						}
					})
			)
			.append(
				$('<button></button>')
					.addClass('btn btn-info btn-sm m-1')
					.text('复制')
					.click(function () {
						var files = JSON.parse(localStorage.getItem('web_editor_files') || '[]');
						// 找到当前的ID的索引
						var index = files.findIndex(function (f) {
							return f.id === file.id;
						});
						// 复制文件
						var new_file = {};
						new_file.name = files[index].name + ' - 副本';
						new_file.id = new Date().getTime().toString(36);
						files.push(new_file);
						localStorage.setItem('web_editor_files', JSON.stringify(files));
						localforage.getItem(files[index].id).then(function (value) {
							localforage.setItem(new_file.id, value);
						});
						location.reload();
					})
			)
			.appendTo($('#files'));
	});
</script>

		<script defer>
			function hex2rgb(hex) {
				let r = 0,
					g = 0,
					b = 0;
				// 3 digits
				if (hex.length == 4) {
					r = parseInt(hex[1] + hex[1], 16);
					g = parseInt(hex[2] + hex[2], 16);
					b = parseInt(hex[3] + hex[3], 16);
				}
				// 6 digits
				else if (hex.length == 7) {
					r = parseInt(hex[1] + hex[2], 16);
					g = parseInt(hex[3] + hex[4], 16);
					b = parseInt(hex[5] + hex[6], 16);
				}
				return [r, g, b];
			}
			const root = '..';

			else $('#mainbody').css('background', 'rgba(' + hex2rgb(color).join(',') + ',0.5)');
			if (localStorage.getItem('no-anim') == 'true') {

				$('#script-mount-node').append(style_noanim);
			}
			if ((localStorage.getItem('dark')||"true") == 'true') {
				$('#html-root').attr('data-bs-theme', 'dark');
			}
			var img = localStorage.getItem('imgbg') || 'bg-1.jpg';
			if (img == 'custom') {
				localforage.getItem('imgbg').then(function (value) {
					$('#bg').attr('src', value);
				});
			} else {
				$('#bg').attr('src', root + '/res/img/' + img);
			}
			// search
			$('#searchResult').html("<a href='#' class='list-group-item'>开始搜索吧</a>");
			// navbar fix
			$('#mainbody').css('padding-top', getComputedStyle(document.getElementsByTagName('nav')[0]).height);
			$(window).resize(function () {
				$('#mainbody').css('padding-top', getComputedStyle(document.getElementsByTagName('nav')[0]).height);
			});
			// parallax
			var scene = document.getElementById('scene');
			var parallax = new Parallax(scene);

			function search() {
				$('#searchResult').empty();
				if ($('#searchInput').val() == '') {
					$('#searchResult').html("<a href='#' class='list-group-item'>开始搜索吧</a>");
					return;
				}
				var res = search_document($('#searchInput').val());
				res.forEach((res) => {
					$('#searchResult').append(
						$('<a class="list-group-item"></a>')
							.attr('href', root + res.url)
							.append($('<span></span>').text(res.title))
							.append($('<span></span>').text(res.tag))
					);
				});
				if (res.length == 0) {
					$('#searchResult').append(
						$('<a class="list-group-item"></a>')
							.attr('href', '#')
							.text('没有找到关于“' + $('#searchInput').val() + '”的结果')
					);
				}
			}
