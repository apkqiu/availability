    <script>
        document.addEventListener('DOMContentLoaded', () => {
            function hex2rgb(hex) {
                let r = 0, g = 0, b = 0;
                // 3 digits
                if (hex.length == 4) {
                    r = parseInt(hex[1] + hex[1], 16);
                    g = parseInt(hex[2] + hex[2], 16);
                    b = parseInt(hex[3] + hex[3], 16);
                }
                // 6 digits
                else if (hex.length == 7) {
                    r = parseInt(hex[1] + hex[2], 16);
                    g = parseInt(hex[3] + hex[4], 16);
                    b = parseInt(hex[5] + hex[6], 16);
                }
                return [r, g, b];
            }
            var color = localStorage.getItem('color') || '#ffffff';
            if (localStorage.getItem("adv_bg") == "false")
                document.getElementById("mainbody").style.background = "rgba(" + hex2rgb(color).join(",") + ",1)";
            else
                document.getElementById("mainbody").style.background = "rgba(" + hex2rgb(color).join(",") + ",0.5)";
        })
    </script>

            <script>
                function set_empty() {
                    var result = document.getElementById("searchResult");
                    var a = document.createElement("a");
                    a.href = "#";
                    a.innerText = "开始搜索吧";
                    a.classList.add("list-group-item");
                    result.appendChild(a);
                }
                document.addEventListener("DOMContentLoaded", function () {
                    set_empty();
                });
                function search() {
                    var input = document.getElementById("searchInput").value;
                    var result = document.getElementById("searchResult");
                    result.innerHTML = "";
                    if (input == "") {
                        set_empty();
                        return;
                    }
                    var res = search_document(input);
                    res.forEach(res => {
                        var a = document.createElement("a");
                        a.href = root + res.url;
                        var span = document.createElement("span");
                        span.innerText = res.title;
                        a.appendChild(span);
                        var small = document.createElement("span");
                        small.style.float = "right";
                        small.style.color = "#aaa";
                        small.innerText = res.tag;
                        a.appendChild(small);
                        a.classList.add("list-group-item");
                        result.appendChild(a);
                    });
                    if (res.length == 0) {
                        var a = document.createElement("a");
                        a.href = "#";
                        a.innerText = "没有找到关于“" + input + "”的结果";
                        a.classList.add("list-group-item");
                        result.appendChild(a);
                    }
                }
            </script>

<h1>自制网页</h1>
<div class="list-group" id="files">
</div>
<script>
    // 从localstorage获取文件数据
    var files = JSON.parse(localStorage.getItem("web_editor_files") || "[]");
    // 添加新文件按钮
    var addFile = document.createElement("a");
    addFile.className = "list-group-item btn btn-success";
    addFile.style.borderRadius = "5px 5px 0px 0px ";
    addFile.href = "../web_maker/edit.html?id=null";
    addFile.innerText = "新建文件";
    document.getElementById("files").appendChild(addFile);

    // 遍历文件数据，生成列表项
    files.forEach(function (file) {
        var item = document.createElement("div");
        item.className = "list-group-item";
        var span = document.createElement("span");
        span.innerText = file.name;
        item.appendChild(span);
        item.appendChild(document.createElement("br"));
        var del = document.createElement("button");
        del.className = "btn btn-danger btn-sm m-1";
        del.innerText = "删除";
        del.onclick = function () {
            var files =  JSON.parse(localStorage.getItem("web_editor_files") || "[]");
            files = files.filter(function (f) {
                return f.id !== file.id;
            });
            localStorage.setItem("web_editor_files", JSON.stringify(files));
            localforage.removeItem(file.id);
            item.remove();
        }
        item.appendChild(del);
        var edit = document.createElement("a");
        edit.className = "btn btn-primary btn-sm m-1";
        edit.innerText = "编辑";
        edit.href = "../web_maker/edit.html?id=" + file.id;
        item.appendChild(edit);
        document.getElementById("files").appendChild(item);
        var rename = document.createElement("button");
        rename.className = "btn btn-warning btn-sm m-1";
        rename.innerText = "重命名";
        rename.onclick = function () {
            var files = JSON.parse(localStorage.getItem("web_editor_files") || "[]");
            // 找到当前的ID的索引
            var index = files.findIndex(function (f) {
                return f.id === file.id;
            });
            // 弹出重命名窗口
            var new_name = prompt("请输入新的文件名", files[index].name);
            if (new_name) {
                files[index].name = new_name;
                localStorage.setItem("web_editor_files", JSON.stringify(files));
                location.reload();
            }
        }
        item.appendChild(rename);
        var copy = document.createElement("button");
        copy.className = "btn btn-info btn-sm m-1";
        copy.innerText = "复制";
        copy.onclick = function () {
            var files = JSON.parse(localStorage.getItem("web_editor_files") || "[]");
            // 找到当前的ID的索引
            var index = files.findIndex(function (f) {
                return f.id === file.id;
            });
            // 复制文件
            var new_file = {};
            new_file.name = files[index].name + " - 副本";
            new_file.id = new Date().getTime().toString(36);
            files.push(new_file);
            localStorage.setItem("web_editor_files", JSON.stringify(files));
            localforage.getItem(files[index].id).then(function (value) {
                localforage.setItem(new_file.id, value);
            
            })
            location.reload();
        }
        item.appendChild(copy);
    });
</script>
