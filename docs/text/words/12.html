<h1>渔家傲·开学</h1><p>李军昊</p><hr><p>窗外月暮日东出，墨尽我问归何处。</p><p>开学回校见老树，钟休住，舞<sup class=footnote-ref><a href=#footnote1>[1]</a><a class=footnote-anchor id=footnote-ref1></a></sup>逆五转留时间。</p><p>钟问是举为何现，我报墨盈业复白。</p><p>欲归钟以无能变，奇迹处，但要开学前一天。</p><hr class=footnotes-sep><section class=footnotes><ol class=footnotes-list><li id=footnote1 class=footnote-item><p>钟的顶部。 <a href=#footnote-ref1 class=footnote-backref>↩︎</a></p></li></ol></section>
