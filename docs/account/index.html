    <script>
        document.addEventListener('DOMContentLoaded', () => {
            function hex2rgb(hex) {
                let r = 0, g = 0, b = 0;
                // 3 digits
                if (hex.length == 4) {
                    r = parseInt(hex[1] + hex[1], 16);
                    g = parseInt(hex[2] + hex[2], 16);
                    b = parseInt(hex[3] + hex[3], 16);
                }
                // 6 digits
                else if (hex.length == 7) {
                    r = parseInt(hex[1] + hex[2], 16);
                    g = parseInt(hex[3] + hex[4], 16);
                    b = parseInt(hex[5] + hex[6], 16);
                }
                return [r, g, b];
            }
            var color = localStorage.getItem('color') || '#ffffff';
            if (localStorage.getItem("adv_bg") == "false")
                document.getElementById("mainbody").style.background = "rgba(" + hex2rgb(color).join(",") + ",1)";
            else
                document.getElementById("mainbody").style.background = "rgba(" + hex2rgb(color).join(",") + ",0.5)";
        })
    </script>

            <script>
                function set_empty() {
                    var result = document.getElementById("searchResult");
                    var a = document.createElement("a");
                    a.href = "#";
                    a.innerText = "开始搜索吧";
                    a.classList.add("list-group-item");
                    result.appendChild(a);
                }
                document.addEventListener("DOMContentLoaded", function () {
                    set_empty();
                });
                function search() {
                    var input = document.getElementById("searchInput").value;
                    var result = document.getElementById("searchResult");
                    result.innerHTML = "";
                    if (input == "") {
                        set_empty();
                        return;
                    }
                    var res = search_document(input);
                    res.forEach(res => {
                        var a = document.createElement("a");
                        a.href = root + res.url;
                        var span = document.createElement("span");
                        span.innerText = res.title;
                        a.appendChild(span);
                        var small = document.createElement("span");
                        small.style.float = "right";
                        small.style.color = "#aaa";
                        small.innerText = res.tag;
                        a.appendChild(small);
                        a.classList.add("list-group-item");
                        result.appendChild(a);
                    });
                    if (res.length == 0) {
                        var a = document.createElement("a");
                        a.href = "#";
                        a.innerText = "没有找到关于“" + input + "”的结果";
                        a.classList.add("list-group-item");
                        result.appendChild(a);
                    }
                }
            </script>

            <ul class="list-group">

                    <button class="btn btn-outline-secondary" type="button" id="button-addon2"
