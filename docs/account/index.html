            <script>
                function set_empty() {
                    var result = document.getElementById("searchResult");
                    var a = document.createElement("a");
                    a.href = "#";
                    a.innerText = "开始搜索吧";
                    a.classList.add("list-group-item");
                    result.appendChild(a);
                }
                document.addEventListener("DOMContentLoaded", function () {
                    set_empty();
                });
                function search() {
                    var input = document.getElementById("searchInput").value;
                    var result = document.getElementById("searchResult");
                    result.innerHTML = "";
                    if (input == "") {
                        set_empty();
                        return;
                    }
                    var res = search_document(input);
                    res.forEach(res => {
                        var a = document.createElement("a");
                        a.href = root + res.url;
                        var span = document.createElement("span");
                        span.innerText = res.title;
                        a.appendChild(span);
                        var small = document.createElement("span");
                        small.style.float = "right";
                        small.style.color = "#aaa";
                        small.innerText = res.tag;
                        a.appendChild(small);
                        a.classList.add("list-group-item");
                        result.appendChild(a);
                    });
                    if (res.length == 0) {
                        var a = document.createElement("a");
                        a.href = "#";
                        a.innerText = "没有找到关于“" + input + "”的结果";
                        a.classList.add("list-group-item");
                        result.appendChild(a);
                    }
                }
            </script>

            <ul class="list-group">
                <li class="input-group clearfix">
                    <input type="text" class="form-control" placeholder="搜索" aria-label="搜索" id="searchInput"
                        aria-describedby="button-addon2" oninput="search()">
                    <button class="btn btn-outline-secondary" type="button" id="button-addon2"
                        onclick="search()">搜索</button>
                </li>
                <div id="searchResult"></div>

<h1>账号管理</h1>
<div class="modal fade" data-bs-backdrop="static" id="Error" tabindex="-1" aria-labelledby="ErrorLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-body">
                检测到您没有账号，将跳转创建
            </div>
            <div class="modal-footer">
                <a type="button" class="btn btn-primary" href="register.html">前往</a>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" data-bs-backdrop="static" id="Ask" tabindex="-1" aria-labelledby="ErrorLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-body">
                更新将清除所有用户数据，继续请输入密码
                <br>
                <input id="password" class="form-control">
            </div>
            <div class="modal-footer">
                <a type="button" class="btn btn-primary" href="javascript:clear()">继续</a>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" data-bs-backdrop="static" id="Error2" tabindex="-1" aria-labelledby="ErrorLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-body">
                密码错误
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">确定</button>
            </div>
        </div>
    </div>
</div>


<h3>当前账号</h3>
<p id="nowAccount"></p>
<script>
    var usernameJSONValue = localStorage.getItem('username');
    var usernameValue = JSON.parse(usernameJSONValue);
    document.getElementById('nowAccount').innerHTML = '当前账号:' + usernameValue + '<br>密码：***';
</script>
<hr>
<h3>账号设置</h3>
<h4 id="personalization">个性化</h4>
<div class="input-group mb-1 w-25">
    <label class="input-group-text" for="color">背景颜色</label>
    <input type="color" id="color" name="color" value="#ffffff"  class="form-control form-control-color">
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var colorValue = localStorage.getItem('color') || '#ffffff';
            document.getElementById('color').value = colorValue;
        })
    </script>
    <button type="button" class="btn btn-primary" onclick="localStorage.setItem('color',document.getElementById('color').value);location.reload()">应用</button>

</div>
<div class="input-group mb-1 w-25">
    <div class="form-control form-switch">
        <input type="checkbox" id="no-anim" role="switch" name="no-anim" class="form-check-input" >
        去除动画
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var value = localStorage.getItem('no-anim') || 'false';
            if(value == 'true'){
                document.getElementById('no-anim').checked = true;
            }
        })
    </script>
    <button type="button" class="btn btn-primary" onclick="localStorage.setItem('no-anim',document.getElementById('no-anim').checked);location.reload()">应用</button>

</div>
<hr>
<button type="button" class="btn btn-danger m-1" onclick="document.getElementById('password').value='';$('#Ask').modal('show')">注销</button>
<a class="btn btn-primary m-1" href="register.html">注册</a>
<script defer>
    //没有账号创建账号
    var accountBe = localStorage.getItem('accountBe');
    if (!accountBe) {
        document.addEventListener("DOMContentLoaded", () => {
            $('#Error').modal('show');
        })
    }
    function clear() {
        var password = document.getElementById('password').value;
        if (password == "密码") {
            localStorage.clear();
            location.href="../home.html";
        } else {
            $("#Ask").modal('hide');
            $('#Error2').modal('show');
        }
    }
</script>
