name: Electron Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-electron:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows builds
          - artifact_name: windows-universal
            os: windows-latest
            platform: win
            arch: universal

          # macOS builds (Intel)
          - artifact_name: mac-universal
            os: macos-latest
            platform: mac
            arch: universal

          # Linux builds
          - artifact_name: linux-universal
            os: ubuntu-latest
            platform: linux
            arch: universal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build Electron app
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qysf-desktop-${{ matrix.artifact_name }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  create-release:
    needs: build-electron
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files for debugging
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/electron-app-win-x64/*
            artifacts/electron-app-win-x86/*
            artifacts/electron-app-win-arm64/*
            artifacts/electron-app-mac-x64/*
            artifacts/electron-app-mac-arm64/*
            artifacts/electron-app-linux-x64/*
            artifacts/electron-app-linux-x86/*
            artifacts/electron-app-linux-arm64/*
            artifacts/electron-app-linux-armv7l/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
