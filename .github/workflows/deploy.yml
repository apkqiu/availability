name: Electron Build and Release

on:
  push:
  workflow_dispatch:

jobs:
  build-electron:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            platform: win
            arch: x64
            artifact_name: win-x64
          - os: windows-latest
            platform: win
            arch: ia32
            artifact_name: win-ia32
          - os: windows-latest
            platform: win
            arch: arm64
            artifact_name: win-arm64

          # macOS builds (Intel)
          - os: macos-12
            platform: mac
            arch: x64
            artifact_name: mac-x64
          # macOS builds (Apple Silicon)
          - os: macos-13
            platform: mac
            arch: arm64
            artifact_name: mac-arm64

          # Linux builds
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact_name: linux-x64
          - os: ubuntu-latest
            platform: linux
            arch: ia32
            artifact_name: linux-ia32
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            artifact_name: linux-arm64
          - os: ubuntu-latest
            platform: linux
            arch: armv7l
            artifact_name: linux-armv7l

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build Electron app
        run: npm run build
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qysf-desktop-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  create-release:
    needs: build-electron
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files for debugging
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/qysf-desktop-linux/*
            artifacts/qysf-desktop-mac/*
            artifacts/qysf-desktop-win/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
