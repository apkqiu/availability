<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在加载...</title>
    <script>var ENTRY = "![[__ENTRY__]]", SIZE = "![[__SIZE__]]";</script>
</head>
<style>
    #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        text-align: center;

    }

    #loading div {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }
</style>

<body>
    <div id="app">
        <div id="loading">
            <div>
                正在准备洽隐山房...
                <span style="font-size:12px; color:lightgray" id="status">正在请求文档</span>
                <div id="progress"
                    style="background: gray; width:10em; height:0.5em; border-radius:100px;display:block">
                    <div id="progress-bar" style="background: rgb(13, 110, 253); width: 0%; border-radius:100px;height:100%"></div>
                </div>
                <noscript>
                    <div style="color:red">
                        加载失败：javascript被禁用。
                    </div>
                </noscript>
            </div>
        </div>
    </div>
</body>
<script>
    var bar = document.getElementById("progress-bar");
    var state = document.getElementById("status");
    var req = new XMLHttpRequest();
    var speed = 0;
    req.open('GET', ENTRY, true);
    req.onabort = function () { state.innerText = "请求被中止。" }
    req.onerror = function () { state.innerText = "请求出错。" }
    req.onload = function () {
        state.innerText = "正在加载页面..."; 
        bar.style.width = '100%';
        clearInterval(interval);
        // create module script
        var script = document.createElement('script');
        document.body.appendChild(script);
        script.type = 'module';
        script.innerHTML = req.responseText;
    }
    req.onloadstart = function () { state.innerText = "正在加载" }
    req.ontimeout = function () {
        state.innerText = "请求超时。正在重试...";
        req.send();
    }
    var start = new Date().getTime();
    var interval = setInterval(function () {
        var percentComplete = req.responseText.length / SIZE * 100;
        bar.style.width = percentComplete + '%';
        speed = req.responseText.length / (new Date().getTime() - start) * 1000;
        state.innerText = `剩余${Math.floor((SIZE - req.responseText.length)/speed/60)||"不到1"}分钟`;
    }, 1)
    req.send();
</script>

</html>
