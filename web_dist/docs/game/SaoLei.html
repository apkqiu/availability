<!doctypehtml><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>扫雷</title><style>.go_black{background-color:#000;animation:go_black 1s ease-in-out}.go_white{background-color:#fff;opacity:0;animation:go_white 1s ease-in-out}@keyframes go_black{0%{background-color:#fff;opacity:0}100%{background-color:#000;opacity:1}}@keyframes go_white{0%{background-color:#000;opacity:1}100%{background-color:#fff;opacity:0}}*{color:#fff}.block{width:2em;height:2em}.no_open{background-color:#a9a9a9}.open{background-color:#fff}.mine{background-color:red}.mine_nonclick{background-color:orange}.flag{background-color:#00f!important}.num1{color:#00f}.num2{color:red}.num3{color:purple}.num4{color:orange}.num5{color:brown}.num6{color:gray}.num7{color:#000}.num8{color:#fff}</style></head><body class=go_black><center><h1>扫雷</h1></center><span>剩余雷数：</span> <span id=mineCount></span><script>var w=parseInt(location.search.split("=")[1]),h=parseInt(location.search.split("=")[2]),m=parseInt(location.search.split("=")[3]),stage=[],button=[];let sleep=e=>new Promise(t=>setTimeout(t,e));var dirx=[-1,-1,-1,0,0,1,1,1],diry=[-1,0,1,-1,1,-1,0,1],puredirx=[1,0,-1,0],purediry=[0,1,0,-1],call_queue=[],stopped=!1;function open_block(s,r){return async function(t=!0){if(!stopped&&!(s<0||w<=s||r<0||h<=r||button[s][r].classList.contains("open")))if(button[s][r].classList.add("open"),0==stage[s][r])for(var e=0;e<4;e++){var n=s+puredirx[e],a=r+purediry[e];n<-1||w<=n||a<0||h<=a||call_queue.push(open_block(n,a))}else if(99==stage[s][r]){if(button[s][r].classList.add("mine"),t){alert("你输了");for(e=0;e<w;e++)for(var o=0;o<h;o++)99!=stage[e][o]||e==s&&o==r||button[e][o].classList.add("mine_nonclick");stopped=!0}}else button[s][r].classList.add("num"+stage[s][r]),button[s][r].innerText=stage[s][r]}}function check_no_more_or_less(){for(var t=0,e=0,n=0;n<w;n++)for(var a=0;a<h;a++)button[n][a].classList.contains("flag")&&(99==stage[n][a]?t++:e++);t==m&&0==e&&(alert("你赢了"),stopped=!0),document.getElementById("mineCount").innerText=t+e<m||t==m&&0==e?m-t-e:"?"}function set_flag(e,n){return function(t){stopped||(button[e][n].classList.contains("flag")?button[e][n].classList.remove("flag"):button[e][n].classList.add("flag"),check_no_more_or_less(),t.preventDefault())}}function pop_queue(){for(var t=0;0<call_queue.length&&t<call_queue.length;)call_queue.shift()(),t++}document.getElementById("mineCount").innerText=m,setInterval(pop_queue,1);for(var i=0;i<h;i++){for(var tmp=[],btnln=[],j=0;j<w;j++){tmp.push(0);var cur=document.createElement("button");cur.onclick=open_block(i,j),cur.oncontextmenu=set_flag(i,j),cur.classList.add("no_open"),cur.classList.add("block"),btnln.push(cur)}stage.push(tmp),button.push(btnln)}function rand_between(t,e){return Math.floor(Math.random()*(e-t+1))%(e-t+1)+t}for(i=0;i<m;i++){var x=rand_between(0,w-1),y=rand_between(0,h-1);99==stage[x][y]&&i--,stage[x][y]=99}for(i=0;i<h;i++)for(j=0;j<w;j++)if(99!=stage[i][j])for(var k=0;k<8;k++){x=j+dirx[k],y=i+diry[k];0<=x&&x<w&&0<=y&&y<h&&(stage[i][j]+=99==stage[y][x]?1:0)}for(var table=document.createElement("table"),i=0;i<h;i++){for(var tr=document.createElement("tr"),j=0;j<w;j++){var td=document.createElement("td");td.appendChild(button[i][j]),tr.appendChild(td)}table.appendChild(tr)}async function play_again(){document.body.classList.add("go_white"),await sleep(1e3),location.reload()}async function go_back(t){document.body.classList.add("go_white"),await sleep(1e3),location.href="index.html?fade"}document.body.appendChild(table)</script><br><button onclick=play_again() style=background:gray>再玩一次</button><br><br><form>配置修改<br><label for=w>宽度：</label> <input style=background:gray type=number id=w name=w value=10><br><label for=h>高度：</label> <input style=background:gray type=number id=h name=h value=10><br><label for=m>雷数：</label> <input style=background:gray type=number id=m name=m value=10><br><input type=submit style=background:gray value=开始新游戏></form><br><button onclick=go_back() style=background:gray>返回</button></body></html>
