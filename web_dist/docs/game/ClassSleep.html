<!doctypehtml><html><head><title>上课睡觉模拟器</title><link rel=stylesheet href=res/All.css><style>body{font-family:Arial,sans-serif;overflow:hidden;background-color:#f0f0f0;margin:0;padding:20px}#game-container{max-width:800px;margin:0 auto;background-color:#fff;padding:20px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.1)}h1{color:#333;text-align:center}.btn{display:inline-block;padding:10px 20px;margin:10px;background-color:#4caf50;color:#fff;text-decoration:none;border-radius:5px;cursor:pointer}.btn:hover{background-color:#45a049}.selection-panel{margin:20px 0;padding:15px;background-color:#f9f9f9;border-radius:5px}.option-group{margin-bottom:15px}.option-group h3{margin-top:0;color:#333}.option{display:inline-block;margin-right:15px;padding:8px 15px;background-color:#e0e0e0;border-radius:5px;cursor:pointer}.option.selected{background-color:#4caf50;color:#fff}#game-screen{display:none}#condition,#quote-display,#sleep-time-display,#status-display{color:#333;text-align:center;margin:10px 0}#teacher-image img{width:50%;margin:0 auto;display:block}.action-btn{width:48%;height:80px;background-color:#4caf50;color:#fff;text-align:center;line-height:80px;font-size:18px;border-radius:5px;cursor:pointer;margin:5px;display:inline-block}.action-btn:hover{background-color:#45a049}#game-over{text-align:center;padding:20px;display:none}#errors{color:red;margin-top:20px}</style></head><body><div id=game-container><h1>上课睡觉模拟器</h1><div id=start-screen><div class=selection-panel><div class=option-group><h3>选择难度</h3><div class="option selected"data-difficulty=easy>简单</div><div class=option data-difficulty=normal>普通</div><div class=option data-difficulty=hard>困难</div></div><div class=option-group><h3>选择状态</h3><div class="option selected"data-status=normal>普通</div><div class=option data-status=stay-up>熬夜</div><div class=option data-status=very-sleepy>极困</div></div></div><a id=start-btn class=btn>开始游戏</a></div><div id=game-screen><p id=condition>状态</p><p id=sleep-time-display></p><p id tartGame(){gameState.difficulty=gameState.selectedDifficulty,gameState.status=gameState.selectedStatus,document.getElementById("start-screen").style.display="none",document.getElementById("game-screen").style.display="block",document.getElementById("game-over").style.display="none",resetGameState(),setupGame()}function resetGameState(){gameState.isSleeping=!1,gameState.totalSleepTime=0,gameState.currentSleepStart=0,gameState.teacherIsLooking=!0,gameState.lastWakeTime=performance.now(),gameState.gameIntervals.forEach(e=>clearInterval(e)),gameState.gameIntervals=[]}function setupGame(){document.getElementById("status-display").textContent=`难度: ${GAME_CONFIG.difficulties[gameState.difficulty].name} | 状态: `+GAME_CONFIG.statuses[gameState.status].name,document.getElementById("sit").addEventListener("mouseover",wakeUp),document.getElementById("sleep").addEventListener("mouseover",fallAsleep),gameState.gameIntervals.push(setInterval(updateGame,100)),gameState.gameIntervals.push(setInterval(changeTeacherState,getRandomTeacherTime())),gameState.gameIntervals.push(setInterval(showRandomQuote,5e3)),0<GAME_CONFIG.statuses[gameState.status].forceSleepTime&&gameState.gameIntervals.push(setInterval(checkForceSleep,1e3))}function updateGame(){updateSleepTime(),checkGameOver()}function updateSleepTime(){var e;gameState.isSleeping?(e=(performance.now()-gameState.currentSleepStart)/1e3,document.getElementById("sleep-time-display").textContent=`本次睡眠时间：${e.toFixed(1)}秒`,document.getElementById("condition").textContent="正在睡眠"):(document.getElementById("sleep-time-display").textContent=`统共睡眠时间：${(gameState.totalSleepTime/1e3).toFixed(1)}秒`,document.getElementById("condition").textContent="正在端坐")}function checkForceSleep(){var e,t;gameState.isSleeping||(e=performance.now()-gameState.lastWakeTime,(t=GAME_CONFIG.statuses[gameState.status].forceSleepTime)<=e?(fallAsleep(),document.getElementById("quote-display").textContent="太困了...坚持不住了...zzz"):(t=Math.ceil((t-e)/1e3))<=5&&(document.getElemen
