{%extends "parts/main.html"%} {%block title%} 屏山听瀑 | 周报 {%endblock%} {%block title_in%} 屏山听瀑 | 周报 {%endblock%} 
{%block body%}
<h1>周报</h1>
<div class="row">
    <div class="col-md-2">
        <h3>热点新闻</h3>
        <ul class="list-group" id="news-list">
            <a class="list-group-item" id="news-wechat" href="#embed=wechat">微信公众号</a>
            <a class="list-group-item" id="news-1" href="#embed=1">2025.7.27我学生胜利完成本周暑假作业</a>
        </ul>
    </div>
    <div class="col-md-10">
        <ul class="nav nav-tabs" id="news-tab">
            <li class="nav-item nav-link disabled">周报出版</li>
            
            <li class="nav-item"><a class="nav-link" href="#p=1" id="p1">第1期</a></li>
            <li class="nav-item"><a class="nav-link" href="#p=2" id="p2">第2期</a></li>
            <li class="nav-item"><a class="nav-link" href="#p=3" id="p3">第3期</a></li>
            <li class="nav-item"><a class="nav-link" href="#p=4" id="p4">第4期</a></li>
            <li class="nav-item"><a class="nav-link" href="#p=5" id="p5">第5期</a></li>
            <li class="nav-item"><a class="nav-link" href="#p=5.5" id="p5.5">第5.5期</a></li>
            <li class="nav-item"><a class="nav-link" href="#p=6" id="p6">第6期</a></li>
            <li class="nav-item"><a class="nav-link" href="#p=7" id="p7">第7期</a></li>
            <li class="nav-item"><a class="nav-link" href="#p=8" id="p8">第8期</a></li>
            <li class="nav-item"><a class="nav-link" href="#p=9" id="p9">第9期</a></li>
        </ul>

        <iframe style="width: 100%; height: 70vh" id="iframe"></iframe>
        <div id="frame" class="hidden" style="width:100%; height: 70vh"></div>
    </div>
</div>
<br /><br />
<script>
    (window.onhashchange = function () {
        var p = getarg('p');
        var embed = getarg('embed');
        var url = getarg('url');
        if (url && should_load("/news/index.html")) {
            load();
            return;
        }
        if (p == null && embed == null) {
            p = 1;
        }
        $("#news-tab>li>a").each((i,e)=>{
            $(e).removeClass('active');
            if($(e).attr("href").indexOf("url=") == -1)
                $(e).attr("href", $(e).attr("href") + "&url=" + url);
        })
        $("#news-list>a").each((i,e)=>{
            $(e).removeClass('active');
            if($(e).attr("href").indexOf("url=") == -1)
                $(e).attr("href", $(e).attr("href") + "&url=" + url);
        })
        if (embed != null) {
            $('#iframe').addClass('hidden');
            $("#iframe").attr("src", "about:blank"); // Release iframe
            $('#frame').removeClass('hidden');
            $("#news-" + embed).addClass('active');
            $("#frame").html('<div class="spinner-border"></div>')
            $.get(true_root + "/news/"+embed + ".html").then((data) => {
                $('#frame').html(data);
            }).fail((err) => {
                $('#frame').html('加载失败');
            })
        }
        if (p != null) {

            $('#frame').addClass('hidden');
            $('#iframe').removeClass('hidden');
            $('#p' + p).addClass('active');
            $('#iframe').attr('src', true_root + '/../components/pdf/web/viewer.html?file=../../../docs/res/pdf/zhoubao' + p + '.pdf');
        }
    })()
</script>
{%endblock%}
