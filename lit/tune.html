      <h3 id="LJHTianjingsha">天净沙</h3>
        <h4>天净沙·一初中</h4><p>教室空调爆炸，厕所榴汁老八，三排三列你爸。没有你爸，放学人在天涯。</p>
        <h4>天净沙·一初中（其二，作于2024.10.9）</h4><p>厕所龙头爆炸，数学一定考砸，三排五列你爸。没有你爸，仍旧被你妈打。</p>
        <h4>天净沙·动点</h4><p>点P你没鸡8，数轴快点爆炸，l1l2你妈。没有你妈，数学考98.</p>

    <h2 id="HouTianyou">侯天佑</h2>
      <h3>宋君曲</h3>
        <h4>宋君曲</h4><p>讲台上面人声吵，朱鑫磊叫我洗草。我起身给他一脚（连读），他跑去找老师了（liao）。</p>
