<!doctype html>
<html>
    <head>
        <title>获取资料</title>
        <link rel="stylesheet" href="css/All.css" />
        <style>
            .tab {
                list-style-type: none;
                border: 1px solid black;
                position: relative;
                float: left;
                padding: 5px;
            }
            #tab1 {
                height: 50px;
            }
            .tabText {
                display: none;
            }
        </style>
    </head>
    <body>
        <div><a class="anone" href="../zhuye.html">洽隐山房主页</a>>资料</div>
        <br />
        <ul id="tab1">
            <li class="tab">视频资料</li>
            <li class="tab">图片资料</li>
        </ul>
        <script>
            var tab = document.querySelectorAll('.tab');
            var tabText = document.querySelectorAll('.tabText');
            for (var i = 0; i < tab.length; i++) {
                tab[i].onmouseover = changeTab;
                tab[i].setAttribute('data-index', i);
            }
            function changeTab() {
                /* 切换颜色 */
                for (var j = 0; j < tab.length; j++) {
                    if (tab[j] != this) {
                        tab[j].style.backgroundColor = 'transparent';
                    } else {
                        this.style.backgroundColor = 'gray';
                    }
                }
                /* 切换内容 */
                var index = this.getAttribute('data-index');
                for (var i = 0; i < tabText.length; i++) {
                    if (i == index) {
                        tabText[i].style.display = 'block';
                    } else {
                        tabText[i].style.display = 'none';
                    }
                }
            }
        </script>

        <div class="tabText">
            <a class="Gbtn" href="vedio/清北学子舞八佾  还有北航和河艺   且往观乎.mp4">八佾舞</a>
        </div>
        <div class="tabText">
            <p>jkk</p>
        </div>

        <!--菜单-->
        <script src="js/All.js"></script>
    </body>
</html>
