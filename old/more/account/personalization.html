<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="../../res/css/BtnGreen1.css">
    <link rel="stylesheet" href="../../res/css/MenuA.css">
    <title>个性化</title>
</head>
<body>

    <!-- 位置 -->
    <div><a class="anone" href="../../zhuye.html">洽隐山房主页</a>><a href="index.html" class="anone">账号</a>>个性化</div>

    <!--菜单-->
    <div id="MenuAPlace"></div>
    <script src="../../res/js/MenuA.js"></script>
    <div id="MenuAArea"></div>

             <!--正文-->
    <p id="backgroundcolor">修改背景颜色
      <input type="text" id="backgroundColorInput" placeholder="背景颜色">
      <a id="backgroundColorBtn">提交</a>
      <p id="backgroundColorNow"></p>
    </p>
    <script>
                         //显示当前
    var nowBackgroundColorJSONValue = localStorage.getItem('backgroundColor');
    var nowBackgroundColorValue = JSON.parse(nowBackgroundColorJSONValue);
    document.getElementById('backgroundColorNow').innerText = '当前颜色：'+nowBackgroundColorValue;
                          //修改颜色
    document.getElementById('backgroundColorBtn').onclick = function () {
        var backgroundColorInput = document.getElementById('backgroundColorInput').value;
        localStorage.setItem('backgroundColor',JSON.stringify(backgroundColorInput));
        if(backgroundColorInput){
            alert('已保存到浏览器,若符合要求，刷新后应用。输入要求（任选一个）：英文颜色名（如blue）、颜色值（如#0f0,#c4f588）、RGB（如rgb(0,255,0),rgb(0,100%,0)）或transparent（默认），否则为默认');
        }else{alert('输入为空!');}
    };
    </script>
</body>
</html>
