		<h2 id="LiJunhao">李军昊</h2>
		<h3>渔家傲</h3>
		<h4>渔家傲·开学(2025-7-31&nbsp;10:39a.m.)</h4>
		<p>
			窗外月暮日东出，墨尽我问归何处。开学回校见老树，钟休住，舞①逆五转留时间。 <br />
			钟问是举为何现，我报墨盈业复白。欲归钟以无能变，奇迹处，但要开学前一天。<br />①舞：钟的顶部。
		</p>

		<h2 id="HuoPeilin">霍沛霖</h2>
		<h3>如梦令</h3>
		<h4>如梦令·暑日课业(2025-7-31&nbsp;9:22a.m.)</h4>
		<p>作业如山愁重，眉皱笔头轻弄。蝉噪暑天长，忽见月移窗缝。急动，急动！墨溅纸间飞涌。</p>
